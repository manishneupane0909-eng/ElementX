<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fabrivium</title>
    <meta
      name="description"
      content="Fabrivium is a scientific computing platform that automates experimental data analysis and helps materials researchers organize, visualize, and understand their measurements."
    />
    <link rel="canonical" href="https://www.fabrivium.com/" />
    <meta property="og:title" content="Fabrivium" />
    <meta
      property="og:description"
      content="From experimental data to materials discovery."
    />
    <meta property="og:url" content="https://www.fabrivium.com/" />
    <meta property="og:type" content="website" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Apply the saved theme before first paint to avoid a flash. Defaults to dark.
      (function () {
        var theme = 'dark'
        try {
          var stored = localStorage.getItem('elementx.theme')
          if (stored === 'light' || stored === 'dark') theme = stored
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
