# LEGACY — Create React App rollback reference. NOT USED for deployment.
# The canonical frontend is frontend/elementx-frontend (Vite); see the root render.yaml and
# docs/PRODUCTION.md. Keep this file only so the CRA app can be redeployed if a rollback is needed.
services:
  - type: web
    name: elementx-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    envVars:
      - key: REACT_APP_API_URL
        sync: false
