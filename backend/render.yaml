# SUPERSEDED — do not point Render at this file.
# The canonical Blueprint is the root render.yaml (persistent disk, production environment guards,
# explicit CORS). This older file has no ELEMENTX_ENV, no disk and no CORS_ORIGINS, so a service
# created from it would run in development mode on ephemeral storage. Kept for history only.
services:
  - type: web
    name: elementx-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
    healthCheckPath: /health
